apiVersion: 1

datasources:
  - name: MySQL
    type: mysql
    url: mysql-server:3306
    user: grafana
    jsonData:
      database: ${MYSQL_DATABASE}
      maxOpenConns: 100 # Grafana v5.4+
      maxIdleConns: 100 # Grafana v5.4+
      maxIdleConnsAuto: true # Grafana v9.5.1+
      connMaxLifetime: 14400 # Grafana v5.4+
    secureJsonData:
      password: grafana1
